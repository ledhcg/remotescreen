# Manual release of the Screon Helper (Developer ID signing, notarization, stapled .dmg, signed update manifest).
# Skeleton: run it only when the maintainer asks for a helper release. It never runs on push or pull_request.
#
# Required repository secrets (values are never stored in this file):
#   DEVELOPER_ID_CERT_P12       base64 of the Developer ID Application certificate + key (.p12)
#   DEVELOPER_ID_CERT_PASSWORD  password of that .p12
#   NOTARY_KEY_ID               App Store Connect API key id
#   NOTARY_ISSUER_ID            App Store Connect issuer id
#   NOTARY_KEY_P8               contents of the API key (.p8)
#   UPDATE_SIGNING_KEY          base64 raw Ed25519 private key for the update manifest
name: Helper release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Helper version, e.g. 0.1.0 (must match Helper/project.yml)"
        required: true
        type: string
      xcode:
        description: "Xcode version to select, e.g. 26.0 (empty = runner default)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish a GitHub Release helper-v<version> with the disk image and the signed update manifest"
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # the build job holds the signing material and gets no write access; only `publish` below can write

jobs:
  release:
    name: Sign, notarize, package
    runs-on: macos-15
    environment: helper-release   # protect this environment with required reviewers
    env:
      KEYCHAIN_NAME: helper-release.keychain-db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require Helper/project.yml
        run: test -f Helper/project.yml || { echo "Helper/project.yml is missing"; exit 1; }
      - name: Check the version and the update public key
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' Helper/project.yml | head -n1)"
          [ "$PROJECT_VERSION" = "$VERSION" ] || { echo "Helper/project.yml says $PROJECT_VERSION, not $VERSION"; exit 1; }
          if grep -q 'REPLACE_WITH_BASE64_ED25519_PUBLIC_KEY' Helper/project.yml; then
            echo "ScreonUpdatePublicKey in Helper/project.yml is still the placeholder; embed the real public key first"; exit 1
          fi
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: |
          if [ -n "$XCODE_VERSION" ] && [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: swift test --no-parallel
      - name: Import the signing certificate into a temporary keychain
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT="$RUNNER_TEMP/developer-id.p12"
          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import "$CERT" -k "$KEYCHAIN_NAME" -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db
          rm -f "$CERT"
      - name: Archive and sign the helper
        run: |
          set -euo pipefail
          (cd Helper && xcodegen generate)
          xcodebuild -project Helper/ScreonHelper.xcodeproj -scheme ScreonHelper \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/ScreonHelper.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_NAME --timestamp" \
            ENABLE_HARDENED_RUNTIME=YES archive
          ditto "$RUNNER_TEMP/ScreonHelper.xcarchive/Products/Applications/ScreonHelper.app" "$RUNNER_TEMP/ScreonHelper.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/ScreonHelper.app"
      - name: Notarize and staple the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$KEY"
          ditto -c -k --keepParent "$RUNNER_TEMP/ScreonHelper.app" "$RUNNER_TEMP/ScreonHelper.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ScreonHelper.zip" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm -f "$KEY"
          xcrun stapler staple "$RUNNER_TEMP/ScreonHelper.app"
          xcrun stapler validate "$RUNNER_TEMP/ScreonHelper.app"
      - name: Build, sign, notarize and staple the disk image
        env:
          VERSION: ${{ inputs.version }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/ScreonHelper-$VERSION.dmg"
          # The image is signed too, so Gatekeeper checks it before the app inside is even opened.
          SIGN_IDENTITY="Developer ID Application" OTHER_KEYCHAIN="$KEYCHAIN_NAME" \
            scripts/make-helper-dmg.sh "$RUNNER_TEMP/ScreonHelper.app" "$DMG"
          KEY="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$KEY"
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm -f "$KEY"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
      - name: Sign the update manifest
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Format read by HelperCore UpdateVerifier: version, url, sha256, releaseURL, minimumMacOS. The signature is detached
          # (base64 Ed25519 over these exact bytes) and must be published next to the manifest as update-manifest.json.sig,
          # because the helper fetches "<manifest URL>.sig".
          DMG="$RUNNER_TEMP/ScreonHelper-$VERSION.dmg"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          BASE="https://github.com/${{ github.repository }}/releases"
          TAG="helper-v$VERSION"
          printf '{"version":"%s","url":"%s/download/%s/ScreonHelper-%s.dmg","sha256":"%s","releaseURL":"%s/tag/%s","minimumMacOS":"15.0"}\n' \
            "$VERSION" "$BASE" "$TAG" "$VERSION" "$SHA" "$BASE" "$TAG" > "$RUNNER_TEMP/update-manifest.json"
          swift scripts/sign-update-manifest.swift "$RUNNER_TEMP/update-manifest.json" "$RUNNER_TEMP/update-manifest.json.sig"
      - name: Keep the disk image and the manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScreonHelper-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/ScreonHelper-${{ inputs.version }}.dmg
            ${{ runner.temp }}/update-manifest.json
            ${{ runner.temp }}/update-manifest.json.sig
          if-no-files-found: error
          retention-days: 30
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME" || true

  # Separate job so the token that can write releases never shares a runner with the signing certificate or notary key.
  # The helper's default manifest URL is https://github.com/<repo>/releases/latest/download/update-manifest.json, so the
  # release is marked latest. Runs only when the maintainer checked `publish`.
  publish:
    name: Publish the GitHub Release
    needs: release
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the release output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScreonHelper-${{ inputs.version }}
          path: out
      - name: Create the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="helper-v$VERSION"
          SHA="$(sha256sum "out/ScreonHelper-$VERSION.dmg" | cut -d' ' -f1)"
          printf 'Screon Helper %s, signed with Developer ID and notarized by Apple (app and disk image).\n\nSHA-256 of the disk image: `%s`\n' \
            "$VERSION" "$SHA" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Screon Helper $VERSION" --latest \
            --notes-file notes.md \
            "out/ScreonHelper-$VERSION.dmg" out/update-manifest.json out/update-manifest.json.sig
