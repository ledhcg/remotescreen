# Dự án Xcode cho app iPhone/iPad, sinh bằng XcodeGen:  cd App && xcodegen generate
# File .xcodeproj được sinh ra và không commit; project.yml là nguồn sự thật.
name: RemoteScreenApp
options:
  bundleIdPrefix: com.ledinhcuong   # tên app còn tạm thời; bundle id có thể đổi sau
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: vi

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  RemoteScreen:
    path: ..

targets:
  RemoteScreenApp:
    type: application
    platform: iOS
    sources:
      - RemoteScreenApp
    dependencies:
      - package: RemoteScreen
        product: RFBKit
      - package: RemoteScreen
        product: RemoteDisplay
      - package: RemoteScreen
        product: InputKit
      - package: RemoteScreen
        product: ConnectionKit
      - package: RemoteScreen
        product: SessionKit
    info:
      path: RemoteScreenApp/Info.plist
      properties:
        CFBundleDisplayName: RemoteScreen
        # Chuột và trackpad của iPad tới app như con trỏ gián tiếp (nút trái/phải, di, cuộn) thay vì giả làm ngón tay.
        UIApplicationSupportsIndirectInputEvents: true
        # Lấy từ build settings (MARKETING_VERSION, CURRENT_PROJECT_VERSION) để tăng số build là đủ cho lần tải lên kế tiếp.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS hỏi quyền "Mạng cục bộ" khi app nối tới máy trong LAN. Nội dung dưới đây hiện trong hộp thoại đó.
        NSLocalNetworkUsageDescription: Ứng dụng cần truy cập mạng cục bộ để tìm và kết nối tới máy Mac của bạn.
        NSBonjourServices:
          - _rfb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledinhcuong.remotescreen
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  RemoteScreenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RemoteScreenAppTests
    dependencies:
      - target: RemoteScreenApp
      - package: RemoteScreen
        product: ConnectionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledinhcuong.remotescreen.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  RemoteScreenAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RemoteScreenAppUITests
    dependencies:
      - target: RemoteScreenApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledinhcuong.remotescreen.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RemoteScreenApp:
    build:
      targets:
        RemoteScreenApp: all
    test:
      targets:
        - RemoteScreenAppTests
        - RemoteScreenAppUITests
