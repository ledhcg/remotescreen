# Xcode project for the iPhone/iPad app, generated by XcodeGen:  cd App && xcodegen generate
# The .xcodeproj is generated and not committed; project.yml is the source of truth.
name: RemoteScreenApp
options:
  bundleIdPrefix: com.ledhcg
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  RemoteScreen:
    path: ..

targets:
  RemoteScreenApp:
    type: application
    platform: iOS
    sources:
      # English-only build: the Vietnamese tables stay in the repo but are not shipped.
      - path: RemoteScreenApp
        excludes: ["Resources/vi.lproj", "Resources/vi.lproj/**"]
    dependencies:
      - package: RemoteScreen
        product: Localization
      - package: RemoteScreen
        product: RFBKit
      - package: RemoteScreen
        product: RemoteDisplay
      - package: RemoteScreen
        product: InputKit
      - package: RemoteScreen
        product: ConnectionKit
      - package: RemoteScreen
        product: SessionKit
    info:
      path: RemoteScreenApp/Info.plist
      properties:
        CFBundleDisplayName: RemoteScreen
        # An iPad mouse and trackpad reach the app as indirect pointers (left/right button, move, scroll) instead of pretending to be fingers.
        UIApplicationSupportsIndirectInputEvents: true
        # Taken from build settings (MARKETING_VERSION, CURRENT_PROJECT_VERSION) so bumping the build number is enough for the next upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS asks for "Local Network" permission when the app connects to a machine on the LAN. The text below appears in that prompt.
        NSLocalNetworkUsageDescription: RemoteScreen needs local network access to find and connect to your Mac.
        NSBonjourServices:
          - _rfb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledhcg.remotescreen
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  RemoteScreenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RemoteScreenAppTests
    dependencies:
      - target: RemoteScreenApp
      - package: RemoteScreen
        product: ConnectionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledhcg.remotescreen.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  RemoteScreenAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RemoteScreenAppUITests
    dependencies:
      - target: RemoteScreenApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledhcg.remotescreen.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RemoteScreenApp:
    build:
      targets:
        RemoteScreenApp: all
    test:
      targets:
        - RemoteScreenAppTests
        - RemoteScreenAppUITests
