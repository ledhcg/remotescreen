# Xcode project for the iPhone/iPad app, generated by XcodeGen:  cd App && xcodegen generate
# The .xcodeproj is generated and not committed; project.yml is the source of truth.
name: ScreonApp
options:
  bundleIdPrefix: com.ledinhcuong
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Screon:
    path: ..

targets:
  ScreonApp:
    type: application
    platform: iOS
    sources:
      # English-only build: the Vietnamese tables stay in the repo but are not shipped.
      - path: ScreonApp
        excludes: ["Resources/vi.lproj", "Resources/vi.lproj/**"]
    dependencies:
      - package: Screon
        product: Localization
      - package: Screon
        product: RFBKit
      - package: Screon
        product: RemoteDisplay
      - package: Screon
        product: InputKit
      - package: Screon
        product: ConnectionKit
      - package: Screon
        product: SessionKit
      - package: Screon
        product: LinkProtocol
      - package: Screon
        product: LinkTransport
      - package: Screon
        product: WindowKit
    info:
      path: ScreonApp/Info.plist
      properties:
        CFBundleDisplayName: Screon
        # An iPad mouse and trackpad reach the app as indirect pointers (left/right button, move, scroll) instead of pretending to be fingers.
        UIApplicationSupportsIndirectInputEvents: true
        # Taken from build settings (MARKETING_VERSION, CURRENT_PROJECT_VERSION) so bumping the build number is enough for the next upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # App Mode: each remote-window scene publishes an activity with the window reference as its target content identifier.
        NSUserActivityTypes:
          - com.ledinhcuong.screon.window
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS asks for "Local Network" permission when the app connects to a machine on the LAN. The text below appears in that prompt.
        NSLocalNetworkUsageDescription: Screon needs local network access to find and connect to your Mac.
        NSBonjourServices:
          - _rfb._tcp
          - _screon-link._udp
        # App Mode: scanning the pairing QR code that the Mac helper shows.
        NSCameraUsageDescription: Screon uses the camera only to scan the pairing code shown by Screon Helper on your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledinhcuong.screon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  ScreonAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ScreonAppTests
    dependencies:
      - target: ScreonApp
      - package: Screon
        product: ConnectionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledinhcuong.screon.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  ScreonAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ScreonAppUITests
    dependencies:
      - target: ScreonApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledinhcuong.screon.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ScreonApp:
    build:
      targets:
        ScreonApp: all
    test:
      targets:
        - ScreonAppTests
        - ScreonAppUITests
