# Xcode project for the Screon Helper (macOS menu bar app), generated by XcodeGen:  cd Helper && xcodegen generate
# The .xcodeproj is generated and not committed; project.yml is the source of truth.
name: ScreonHelper
options:
  bundleIdPrefix: com.ledinhcuong
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Screon:
    path: ..

targets:
  ScreonHelper:
    type: application
    platform: macOS
    sources:
      - path: ScreonHelper
        excludes: ["Info.plist"]
    dependencies:
      - package: Screon
        product: Localization
      - package: Screon
        product: LinkProtocol
      - package: Screon
        product: LinkTransport
      - package: Screon
        product: HelperCore
    entitlements:
      path: ScreonHelper/ScreonHelper.entitlements
    info:
      path: ScreonHelper/Info.plist
      properties:
        CFBundleDisplayName: Screon Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, vi]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        # Menu bar app: no Dock icon, no main window.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
        # macOS asks for "Local Network" when the helper listens and advertises itself on the LAN.
        NSLocalNetworkUsageDescription: Screon Helper needs local network access so your iPad can find and connect to this Mac.
        NSBonjourServices:
          - _screon-link._udp
        # Update check (HelperCore UpdateChecker). The manifest and its detached signature (<url>.sig) are fetched over HTTPS and the
        # signature is verified with the Ed25519 public key below before anything in the manifest is trusted.
        ScreonUpdateManifestURL: https://github.com/ledhcg/screon/releases/latest/download/update-manifest.json
        # TODO(maintainer): replace with the base64 raw Ed25519 public key printed by
        #   UPDATE_SIGNING_KEY=... swift scripts/sign-update-manifest.swift --public-key
        # While this placeholder is in place the update check reports "not configured" and makes no network request.
        ScreonUpdatePublicKey: REPLACE_WITH_BASE64_ED25519_PUBLIC_KEY
    settings:
      base:
        PRODUCT_NAME: ScreonHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.ledinhcuong.screon.helper
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "5"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ScreonHelper:
    build:
      targets:
        ScreonHelper: all
    run:
      config: Debug
    archive:
      config: Release
